spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-web
  template:
    metadata:
      labels:
        app: todo-web
    spec:
      volumes:
        - name: app-code
          configMap:
            name: todo-app-config
            defaultMode: 420
      containers:
        - resources: {}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          name: web
          command:
            - /bin/sh
            - '-c'
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: REDIS_HOST
              value: redis-service
            - name: APP_TITLE
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: APP_TITLE
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: REDIS_PASSWORD
            - name: ADMIN_PIN
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: ADMIN_PIN
          ports:
            - containerPort: 8080
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: app-code
              mountPath: /app
          terminationMessagePolicy: File
          image: 'registry.redhat.io/ubi9/python-312:9.8-1793254183'
          args:
            - pip install flask redis && python /app/app.py
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
